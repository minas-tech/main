<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinasTech | Δείγματα Δουλειάς</title>
    <meta name="description" content="MinasTech — Δείγματα δουλειάς από επισκευές, PC builds, 3D εκτυπώσεις και laser εργασίες.">
    <meta name="theme-color" content="#0f172a">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="el_GR">
    <meta property="og:title" content="MinasTech | Δείγματα Δουλειάς">
    <meta property="og:description" content="Portfolio από PC builds, 3D printing και laser εργασίες.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #06b6d4;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;

            --gradient-primary: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .section-padding { padding: 6rem 0; }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }

        .nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i { color: var(--primary); }

        .nav-menu {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-link {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            position: relative;
        }

        .nav-link:hover, .nav-link.active { color: var(--text-main); }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px; left: 0; width: 0; height: 2px;
            background: var(--primary);
            transition: 0.3s;
        }

        .nav-link:hover::after { width: 100%; }

        .mobile-toggle { display: none; font-size: 1.5rem; cursor: pointer; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.9rem 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: white;
        }

        .btn:hover {
            border-color: var(--text-main);
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .header {
            padding-top: 80px;
            background: radial-gradient(circle at 10% 20%, rgba(37,99,235,0.05) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(6,182,212,0.05) 0%, transparent 40%);
        }

        .page-hero {
            padding: 4.5rem 0 2.5rem;
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            border-radius: 100px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .page-hero h1 {
            font-size: clamp(2.25rem, 4vw, 3.25rem);
            margin-bottom: 1rem;
        }

        .text-gradient {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-hero p {
            color: var(--text-muted);
            max-width: 760px;
            margin: 0.75rem auto 0;
            font-size: 1.05rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.25rem;
            padding-bottom: 2rem;
        }

        .project-card {
            grid-column: span 6;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: 0.3s;
            box-shadow: var(--shadow-sm);
        }

        .project-card:hover {
            border-color: rgba(37, 99, 235, 0.35);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .project-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            background: #e2e8f0;
        }

        .project-card figcaption {
            padding: 1rem 1.1rem 1.15rem;
            display: grid;
            gap: 0.25rem;
        }

        .project-card figcaption strong { font-weight: 700; }

        .project-card figcaption span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .hint {
            text-align: center;
            margin-top: 0.75rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer {
            background: var(--text-main);
            color: #94a3b8;
            padding: 3rem 0 2rem;
            border-top: 1px solid #1e293b;
        }

        .copyright {
            text-align: center;
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .mobile-toggle { display: block; }

            .nav-menu {
                position: fixed;
                top: 80px; left: 0; right: 0;
                background: white;
                flex-direction: column;
                padding: 2rem;
                gap: 1.5rem;
                border-bottom: 1px solid var(--border);
                transform: translateY(-150%);
                transition: transform 0.3s ease;
                z-index: 999;
            }

            .nav-menu.active { transform: translateY(0); box-shadow: var(--shadow-lg); }

            .project-card { grid-column: span 12; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="container nav-inner">
            <a href="index.html" class="logo">
                <i class="fas fa-layer-group"></i> MinasTech
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html#services" class="nav-link">Υπηρεσίες</a></li>
                <li><a href="index.html#pricing" class="nav-link">Κοστολόγηση</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="index.html#contact" class="nav-link">Επικοινωνία</a></li>
                <li><a href="projects.html" class="btn"><i class="fas fa-folder-open"></i> Δείγματα</a></li>
            </ul>
            <div class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <header class="header">
        <div class="container page-hero">
            <div class="badge"><i class="fas fa-folder-open"></i> Portfolio</div>
            <h1>Δείγματα <span class="text-gradient">Δουλειάς</span></h1>
            <p>
                Φωτογραφίες από builds, επισκευές, 3D εκτυπώσεις και laser εργασίες.
            </p>
        </div>
    </header>

    <main class="section-padding" aria-label="Portfolio projects">
        <div class="container">
            <div class="projects-grid">
                <figure class="project-card">
                    <img src="photos/IMG_3541.jpeg" alt="Δείγμα έργου 1" loading="lazy" onerror="this.closest('figure').style.display='none'">
                </figure>

                <figure class="project-card">
                    <img src="photos/sample-2.jpeg" alt="Δείγμα έργου 2" loading="lazy" onerror="this.closest('figure').style.display='none'">
                </figure>

                <figure class="project-card">
                    <img src="photos/IMG_7479.jpeg" alt="Δείγμα έργου 3" loading="lazy" onerror="this.closest('figure').style.display='none'">
                </figure>

                <figure class="project-card">
                    <img src="photos/sample-4.jpeg" alt="Δείγμα έργου 4" loading="lazy" onerror="this.closest('figure').style.display='none'">
                </figure>
                
                <figure class="project-card">
                    <img src="photos/IMG_7527.jpeg" alt="Δείγμα έργου 4" loading="lazy" onerror="this.closest('figure').style.display='none'">
                </figure>
                
                <figure class="project-card">
                    <img src="photos/sample-6.jpeg" alt="Δείγμα έργου 4" loading="lazy" onerror="this.closest('figure').style.display='none'">
                </figure>

                <figure class="project-card">
                    <img src="photos/sample-7.jpeg" alt="Δείγμα έργου 4" loading="lazy" onerror="this.closest('figure').style.display='none'">
                </figure>

                <figure class="project-card">
                    <img src="photos/sample-7.jpeg" alt="Δείγμα έργου 4" loading="lazy" onerror="this.closest('figure').style.display='none'">
                </figure>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="copyright">
                © 2026 MinasTech. Designed with precision.
            </div>
        </div>
    </footer>

    <script>
        // Mobile Menu Toggle
        const toggleBtn = document.getElementById('mobileToggle');
        const navMenu = document.getElementById('navMenu');

        toggleBtn.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            const icon = toggleBtn.querySelector('i');
            if (navMenu.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        });

        // Close menu on click
        navMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
                const icon = toggleBtn.querySelector('i');
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            });
        });

        // Sticky Navbar effect
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            if (window.scrollY > 50) {
                nav.style.boxShadow = "0 4px 20px rgba(0,0,0,0.05)";
                nav.style.background = "rgba(255, 255, 255, 0.95)";
            } else {
                nav.style.boxShadow = "none";
                nav.style.background = "rgba(255, 255, 255, 0.8)";
            }
        });
    </script>
</body>
</html>
